services:
  # SUNSHARE Backend API Web Service
  - type: web
    name: sunshare-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: sunshare-db
          property: connectionString
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: SUNSHARE_CONTRACT_ID
        value: CBZ3D74BRL6T74X35E2RHK3F4EQH2Z5T6KLRB62E3K4PY7W2X6EEXAMPLE

databases:
  - name: sunshare-db
    databaseName: sunshare
    user: sunshare_user
    plan: free
    region: oregon

